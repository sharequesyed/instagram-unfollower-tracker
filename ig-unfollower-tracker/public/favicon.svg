<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="skullGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#7c3aed" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Skull Base Silhouette -->
  <path
    d="M16 3C9.37 3 4 8.37 4 15c0 4.23 2.19 7.95 5.5 10.12V27c0 1.1.9 2 2 2h9c1.1 0 2-.9 2-2v-1.88C25.81 22.95 28 19.23 28 15 28 8.37 22.63 3 16 3Z"
    fill="url(#skullGrad)"
    filter="url(#glow)"
  />

  <!-- Eye Sockets (Dark cutout) -->
  <ellipse cx="11.5" cy="14.5" rx="3" ry="3.5" fill="#0f172a" transform="rotate(-6 11.5 14.5)"/>
  <ellipse cx="20.5" cy="14.5" rx="3" ry="3.5" fill="#0f172a" transform="rotate(6 20.5 14.5)"/>

  <!-- Glowing Eye Pupils (Subtle highlight) -->
  <circle cx="11.8" cy="14.2" r="1" fill="#c084fc"/>
  <circle cx="20.2" cy="14.2" r="1" fill="#c084fc"/>

  <!-- Inverted Heart Nose -->
  <path d="M16 19.5L14.8 22h2.4L16 19.5Z" fill="#0f172a"/>

  <!-- Teeth / Jaw Separations -->
  <rect x="13.2" y="25" width="1.6" height="4" rx="0.8" fill="#0f172a"/>
  <rect x="17.2" y="25" width="1.6" height="4" rx="0.8" fill="#0f172a"/>
</svg>